<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tonkova pivní anatomie – hospody a naše poznámky</title>

  <link rel="icon" type="image/png" href="favicon.png?v=4">
  <link rel="shortcut icon" type="image/png" href="favicon.png?v=4">

  <!-- Leaflet CSS (lokální verze pro spolehlivost bez nutnosti API klíče + CDN záloha) -->
  <link rel="stylesheet" href="lib/leaflet.css">
  <script>
    // Fallback pokud by lokální css selhalo
    if (!document.querySelector('link[href="lib/leaflet.css"]')) {
      document.write('<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">');
    }
  </script>

  <!-- Styl aplikace -->
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-container">
    <!-- LEVÝ POSTRANNÍ PANEL (Seznam a filtry) -->
    <aside class="sidebar">
      <button id="mobile-list-toggle" class="mobile-list-toggle" type="button" aria-expanded="false" aria-controls="pubs-list">
        <span aria-hidden="true">☰</span>
        <span class="mobile-list-toggle-label">Zobrazit hospody</span>
      </button>
      <div class="sidebar-header">
        <div class="brand">
          <div class="brand-title-wrap">
            <img class="brand-icon" src="logo.png" alt="" aria-hidden="true">
            <div>
              <h1 class="brand-title">Tonkova pivní anatomie</h1>
              <div class="brand-subtitle">Zápisky z pivních návštěv studenta medicíny <b>Tonka a jeho přátel.</b></div>
            </div>
          </div>
        </div>

        <!-- Akční tlačítka -->
        <div class="action-bar">
          <button id="btn-routes" class="btn-action">
            <span aria-hidden="true">↗</span> Doporučené trasy
          </button>
          <a id="btn-add-pub" class="btn-action suggest-action" href="https://forms.gle/5bmLsGDhwgvkP8c88" target="_blank" rel="noopener noreferrer">
            Navrhnout hospodu
          </a>
        </div>

        <!-- Vyhledávací pole -->
        <div class="search-wrapper">
          <span class="search-icon" aria-hidden="true">⌕</span>
          <input type="text" id="search-input" class="search-input" aria-label="Hledat hospodu, pivo, čtvrť nebo poznámku" placeholder="Hledej hospodu, pivo, čtvrť, poznámku...">
          <button id="search-clear" class="search-clear" title="Vymazat hledání" aria-label="Vymazat hledání">✕</button>
        </div>

        <!-- Rychlé filtry (chips) -->
        <div class="filter-chips">
          <button class="chip active" data-filter="all">Vše</button>
          <button class="chip" data-filter="top">Hodnocení 9+</button>
          <button class="chip" data-filter="tank">Tanková Plzeň</button>
          <button class="chip" data-filter="cheap">Do 60 Kč</button>
          <button class="chip" data-filter="center">Centrum</button>
          <button class="chip" data-filter="garden">Zahrádka</button>
          <button class="chip" data-filter="underground">Underground</button>
          <button class="chip" data-filter="hipster">Craft</button>
        </div>
      </div>

      <!-- Počítadlo a řazení -->
      <div class="list-meta">
        <div id="pubs-count" class="list-count">Načítám hospody...</div>
        <div>
          <select id="sort-select" class="sort-select" aria-label="Řadit hospody">
            <option value="rating-desc">Nejvyšší hodnocení</option>
            <option value="name-asc">Podle názvu (A-Z)</option>
            <option value="district">Podle čtvrti</option>
            <option value="rating-asc">Nejnižší hodnocení</option>
          </select>
        </div>
      </div>

      <!-- Rolovací seznam karet hospod -->
      <div id="pubs-list" class="pubs-list">
        <!-- Generováno dynamicky v app.js -->
      </div>
    </aside>

    <!-- PRAVÁ ČÁST: INTERAKTIVNÍ MAPA -->
    <main class="map-container">
      <div id="map"></div>

      <!-- Přepínač mapových stylů: Světlý / Tmavý režim -->
      <div class="map-theme-toggle">
        <button class="theme-btn active" data-theme="light">Světlá</button>
        <button class="theme-btn" data-theme="dark">Tmavá</button>
      </div>

      <!-- Legenda hodnocení -->
      <div class="map-stats-pill">
        <span><i class="dot-indicator dot-gold"></i> 9 a víc</span>
        <span><i class="dot-indicator dot-amber"></i> 8–8,9</span>
        <span><i class="dot-indicator dot-blue"></i> Méně než 8</span>
        <span><i class="dot-indicator dot-neutral"></i> Bez hodnocení</span>
      </div>
    </main>
  </div>

  <!-- DETAIL DRAWER / MODAL (Vyskakovací panel s plnými zápisky) -->
  <div id="detail-overlay" class="detail-overlay" role="dialog" aria-modal="true" aria-label="Detail hospody" aria-hidden="true" tabindex="-1">
    <div class="detail-drawer">
      <div id="detail-content">
        <!-- Vykresleno javascriptem při kliku -->
      </div>
    </div>
  </div>

  <!-- MODAL: PIVNÍ TRASY (PUB CRAWLS) -->
  <div id="pub-crawls-modal" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="pub-crawls-title" aria-hidden="true" tabindex="-1">
    <div class="modal-window">
      <div class="modal-header">
        <h3 id="pub-crawls-title" class="modal-title">Trasy</h3>
        <button type="button" class="detail-close-btn modal-close-btn" aria-label="Zavřít">✕</button>
      </div>
      <p class="modal-intro">
        Pár zastávek, které dává smysl spojit pěšky. Trasu můžeš zobrazit na mapě nebo otevřít v Google Maps.
      </p>
      <div id="pub-crawls-container">
        <!-- Generováno z pubCrawlRoutes -->
      </div>
    </div>
  </div>

  <!-- TOAST OZNÁMENÍ -->
  <div id="toast" class="toast" role="status" aria-live="polite">Notifikace</div>

  <!-- Leaflet JS (lokální + fallback) -->
  <script src="lib/leaflet.js"></script>
  <script>
    if (typeof L === 'undefined') {
      document.write('<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"><\/script>');
    }
  </script>

  <!-- Skripty aplikace -->
  <script src="data.js"></script>
  <script src="app-utils.js"></script>
  <script src="app.js"></script>
</body>
</html>
